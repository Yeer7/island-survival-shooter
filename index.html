<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashes of the Forest — OpenGame Jam</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b141a;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #f4f7f5;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.7);
        z-index: 2;
        pointer-events: none;
        display: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        /* Light vignette on the menu side only: the live scene stays sharp and bright. */
        background: linear-gradient(90deg, rgba(6, 12, 16, 0.72) 0%, rgba(6, 12, 16, 0.38) 36%, rgba(6, 12, 16, 0) 62%);
        z-index: 10;
        padding: 0 clamp(20px, 6vw, 90px);
      }
      .menu {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        max-width: 460px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      }
      .menu .kicker {
        font-size: 0.75rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #f0b36a;
      }
      .menu h1 {
        font-size: clamp(2.2rem, 5vw, 3.6rem);
        line-height: 1;
        letter-spacing: 0.04em;
        font-weight: 800;
      }
      .menu .sub {
        font-size: 1.05rem;
        color: #e9d9c2;
        font-style: italic;
        margin-top: -6px;
      }
      .menu p {
        color: #d8e2dc;
        font-size: 0.95rem;
        line-height: 1.45;
      }
      .controls {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: #c8d6d0;
        font-size: 0.82rem;
      }
      .controls kbd {
        display: inline-block;
        padding: 0 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        font: 600 0.76rem/1.5 system-ui, sans-serif;
      }
      .sens {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        color: #c8d6d0;
      }
      .sens input {
        width: 160px;
        accent-color: #d97706;
      }
      .sens span {
        width: 44px;
        text-align: left;
        font-variant-numeric: tabular-nums;
      }
      .menu .actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      #play-btn {
        padding: 13px 30px;
        border: none;
        border-radius: 8px;
        background: #d97706;
        color: #fff;
        font-weight: 800;
        font-size: 1rem;
        letter-spacing: 0.06em;
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(217, 119, 6, 0.35);
      }
      #play-btn:hover {
        background: #b45309;
      }
      .linkbtn {
        border: 0;
        background: none;
        color: #d4ddd8;
        font-size: 0.82rem;
        text-decoration: underline;
        cursor: pointer;
        opacity: 0.85;
      }
      .linkbtn:hover {
        opacity: 1;
        color: #fff;
      }
      .lang {
        position: fixed;
        top: 18px;
        right: 20px;
        display: flex;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.35);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      }
      .lang button {
        border: 0;
        padding: 6px 14px;
        background: none;
        color: #e7ece9;
        font: 700 0.78rem system-ui, sans-serif;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .lang button.on {
        background: #d97706;
        color: #fff;
      }
      #credits {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(4, 8, 10, 0.6);
      }
      #credits.on {
        display: flex;
      }
      #credits .card {
        max-width: 560px;
        max-height: 80vh;
        overflow: auto;
        padding: 24px 26px;
        border-radius: 14px;
        background: #13201f;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        text-align: left;
      }
      #credits h2 {
        margin-bottom: 6px;
      }
      #credits ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0 16px;
        font-size: 0.88rem;
        color: #d3ddd8;
      }
      #credits b {
        color: #fff;
      }
      #credits .close {
        padding: 9px 20px;
        border: 0;
        border-radius: 8px;
        background: #d97706;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="crosshair"></div>
    <div id="overlay">
      <div class="menu">
        <span class="kicker" data-i18n="kicker"></span>
        <h1>ASHES OF THE FOREST</h1>
        <span class="sub" data-i18n="sub"></span>
        <p data-i18n="tagline"></p>
        <ul class="controls" data-i18n-html="controls"></ul>
        <label class="sens"><span data-i18n="sens" style="width: auto"></span>
          <input id="sens" type="range" min="0.3" max="2.5" step="0.05" value="1" />
          <span id="sens-val">1.00×</span>
        </label>
        <div class="actions">
          <button id="play-btn"></button>
          <button id="newgame-btn" class="linkbtn" type="button" data-i18n="newgame"></button>
          <button id="credits-btn" class="linkbtn" type="button" data-i18n="credits"></button>
        </div>
      </div>
      <div class="lang"><button data-lang="pt">PT</button><button data-lang="en">EN</button></div>
    </div>
    <div id="credits"><div class="card" data-i18n-html="creditsBody"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
