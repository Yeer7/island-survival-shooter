<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island Survival Shooter — OpenGame Jam</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b141a;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #f4f7f5;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.7);
        z-index: 2;
        pointer-events: none;
        display: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(8, 16, 20, 0.72);
        backdrop-filter: blur(4px);
        z-index: 10;
        gap: 14px;
        text-align: center;
        padding: 24px;
      }
      #overlay h1 {
        font-size: 2rem;
        letter-spacing: 0.04em;
      }
      #overlay p {
        max-width: 460px;
        color: #c8d6d0;
        font-size: 0.95rem;
      }
      .controls {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: #c8d6d0;
        font-size: 0.85rem;
      }
      .controls kbd {
        display: inline-block;
        padding: 0 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font: 600 0.78rem/1.5 system-ui, sans-serif;
      }
      #play-btn {
        padding: 12px 28px;
        border: none;
        border-radius: 8px;
        background: #d97706;
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
      #play-btn:hover {
        background: #b45309;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="crosshair"></div>
    <div id="overlay">
      <h1>ISLAND SURVIVAL SHOOTER</h1>
      <p>Você acordou na praia, ao lado do avião em chamas. Quebre as malas, ache a pistola do piloto e corte lenha antes do anoitecer.</p>
      <ul class="controls">
        <li><kbd>WASD</kbd> mover · <kbd>Shift</kbd> correr · <kbd>Espaço</kbd> pular</li>
        <li><kbd>Clique</kbd> usar · <kbd>1</kbd>–<kbd>5</kbd> / roda: trocar item</li>
        <li><kbd>E</kbd> coletar · <kbd>G</kbd> soltar tora · <kbd>R</kbd> recarregar · <kbd>Esc</kbd> pausa</li>
      </ul>
      <button id="play-btn">ENTRAR NA ILHA</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
